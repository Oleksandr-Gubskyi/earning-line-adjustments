services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    working_dir: /app
    volumes:
      - .:/app
    # The php:*-cli image runs `php -a` by default, which exits immediately without a TTY.
    # The container must stay alive so `docker compose exec` works.
    command: sleep infinity
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: payroll
      MYSQL_USER: payroll
      MYSQL_PASSWORD: secret
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    # Migrations must not race the database on first boot.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "payroll", "-psecret"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 20s
    ports:
      - "3307:3306"

volumes:
  mysql-data:
